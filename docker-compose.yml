services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintaro
      POSTGRES_PASSWORD: fintaro
      POSTGRES_DB: fintaro
    ports:
      - "5432:5432"
    volumes:
      - fintaro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintaro -d fintaro"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fintaro:fintaro@db:5432/fintaro?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-development-secret-change-me}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  fintaro_postgres:
